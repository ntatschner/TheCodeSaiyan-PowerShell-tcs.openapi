# Creates a version tag (e.g. v0.0.3) when ModuleVersion in the manifest is greater
# than the current latest tag. Chained after CI Validate on main, or on push/manual.
name: Create Version Tag

on:
  workflow_run:
    workflows: ['CI - Validate Module']
    types: [completed]
    branches: [ main ]
  workflow_dispatch:

jobs:
  create-tag:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    uses: ntatschner/tcs-shared-workflows/.github/workflows/create-version-tag.yml@main
    with:
      module-name: 'tcs.openapi'
      module-path: 'modules/tcs.openapi'
      tag-prefix: 'v'
      ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
    secrets:
      repo-token: ${{ secrets.GITHUB_TOKEN }}
